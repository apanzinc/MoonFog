name: 功能建议
description: 提一个新功能或改进
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么
      description: 现在的痛点是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 设想方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
