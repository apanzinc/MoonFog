name: Release

run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 1.2.3。仓库 Secret CRX_PRIVATE_KEY 须为 PEM 私钥（决定扩展 ID，每次发布用同一把）。"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require a branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/*) ;;
            *)
              echo "请从分支运行 Release，当前是 ${GITHUB_REF}" >&2
              exit 1
              ;;
          esac

      - name: Normalize version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}"
          node scripts/extension-version.mjs "$VERSION" manifest.json
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "tag v${VERSION} 已存在" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Load signing key
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "缺少 Secret CRX_PRIVATE_KEY。用 openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out key.pem 生成后，把 PEM 全文存入该 Secret。" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import pathlib
          raw = os.environ["CRX_PRIVATE_KEY"]
          if "\\n" in raw and raw.count("\n") < 2:
              raw = raw.replace("\\n", "\n")
          if "PRIVATE KEY" not in raw:
              raise SystemExit("CRX_PRIVATE_KEY 不是 PEM 私钥")
          if not raw.endswith("\n"):
              raw += "\n"
          pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("crx.pem").write_text(raw)
          PY

      - name: Verify manifest version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const want = process.env.VERSION;
          const got = String(JSON.parse(readFileSync('manifest.json', 'utf8')).version || '');
          if (got !== want) {
            console.error(`manifest.json 当前是 ${got}，但本次要发布 ${want}。`);
            console.error(`请先合并一个标题为 "chore: release v${want}" 的 PR 把 manifest.json 改成 ${want}，再重新运行本工作流。`);
            process.exit(1);
          }
          EOF

      - run: npm ci
      - run: npm run check

      - name: Pack CRX
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/pack-extension.mjs --key "$RUNNER_TEMP/crx.pem" --name "MoonFog-${VERSION}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            "dist/MoonFog-${VERSION}.crx" \
            "dist/MoonFog-${VERSION}.zip" \
            --target "$(git rev-parse HEAD)" \
            --title "MoonFog v${VERSION}" \
            --generate-notes
